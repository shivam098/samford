<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Samford workflow lab (synthetic demo)</title>
<script>
  // Current address of the app. Update-PublicLink.ps1 rewrites this line when the tunnel restarts; '' means offline.
  var APP_TARGET = 'https://preview-ellen-excitement-continuing.trycloudflare.com';
  // Keep the path after /samford (for example /share/<token>), the query string and the hash.
  var rest = location.pathname.replace(/^\/samford\/?/, '/') + location.search + location.hash;
  if (APP_TARGET) location.replace(APP_TARGET.replace(/\/$/, '') + rest);
</script>
<style>body{font-family:system-ui,sans-serif;background:#f7f5f0;color:#27272a;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:1rem;text-align:center}a{color:#92400e}</style>
</head>
<body>
<p id="opening">Opening Samford workflow lab (synthetic demo)… If nothing happens, <a id="go" href="https://preview-ellen-excitement-continuing.trycloudflare.com">tap here</a>.</p>
<p id="offline" hidden>Samford workflow lab (synthetic demo) is offline right now. Please try again later.</p>
<script>
  if (APP_TARGET) {
    document.getElementById('go').href = APP_TARGET.replace(/\/$/, '') + rest;
  } else {
    document.getElementById('opening').hidden = true;
    document.getElementById('offline').hidden = false;
  }
</script>
</body>
</html>
